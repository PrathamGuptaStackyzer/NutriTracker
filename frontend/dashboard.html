<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NutriTracker.ai</title>
    
    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Your global + dashboard styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    
    <!-- Dark Mode Script (runs before page loads) -->
    <script src="js/dark-mode.js"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-leaf me-2"></i>NutriTracker.ai
            </span>
            <button class="btn btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
            </button>
        </div>
    </nav>
    
    <!-- Main Layout -->
    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="sidebar-item active" data-page="overview">
                <i class="fas fa-home"></i><span>Overview</span>
            </div>
            <div class="sidebar-item" data-page="add-meal">
                <i class="fas fa-plus-circle"></i><span>Add Meal</span>
            </div>
            <div class="sidebar-item" data-page="history">
                <i class="fas fa-history"></i><span>History</span>
            </div>
            <div class="sidebar-item" data-page="profile">
                <i class="fas fa-user"></i><span>User Profile</span>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area" id="content-area">
            <!-- Overview Page (iframe) -->
            <iframe id="overview-iframe" src="overview.html" class="page-iframe active"></iframe>
            
            <!-- Add Meal Page (iframe) -->
            <iframe id="add-meal-iframe" src="add-meal.html" class="page-iframe"></iframe>
            
            <!-- History Page (iframe) -->
            <iframe id="history-iframe" src="history.html" class="page-iframe"></iframe>
            
            <!-- Profile Page (iframe) -->
            <iframe id="profile-iframe" src="profile.html" class="page-iframe"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
