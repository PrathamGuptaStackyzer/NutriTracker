<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NutriTracker.ai</title>
    
    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Your global + dashboard styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-leaf me-2"></i>NutriTracker.ai
            </span>
            <button class="btn btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
            </button>
        </div>
    </nav>
    
    <!-- Main Layout -->
    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="sidebar-item active">
                <i class="fas fa-home"></i><span>Overview</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-plus-circle"></i><span>Add Meal</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-history"></i><span>History</span>
            </div>
            <a href="profile.html" class="sidebar-item">
                <i class="fas fa-user"></i><span>User Profile</span>
            </a>
        </div>

        <!-- Content Area - You can add your own pages here later -->
        <div class="content-area">
            <!-- Your future content goes here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
