<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NutriTracker.ai</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #2E7D32;
            --primary-green-dark: #1B5E20;
        }
        
        body {
            background: linear-gradient(135deg, #F1F8E9 0%, #E8F5E9 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 80px auto;
            padding: 40px 20px;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 16px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .dashboard-icon {
            font-size: 120px;
            color: var(--primary-green);
            margin-bottom: 30px;
        }
        
        .dashboard-title {
            color: var(--primary-green-dark);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .dashboard-subtitle {
            color: #6c757d;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        
        .welcome-message {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .btn-logout:hover {
            background: #c82333;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark fixed-top">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-leaf me-2"></i>NutriTracker.ai
            </span>
            <button class="btn btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
            </button>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container dashboard-container">
        <div class="dashboard-card">
            <div class="welcome-message">
                <h4><i class="fas fa-user-check me-2"></i>Welcome back!</h4>
                <p class="mb-0">You have successfully completed onboarding.</p>
            </div>
            
            <i class="fas fa-chart-line dashboard-icon"></i>
            <h1 class="dashboard-title">This is Dashboard</h1>
            <p class="dashboard-subtitle">
                Your personalized nutrition tracking dashboard will appear here
            </p>
            
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i>
                <strong>Coming Soon:</strong> Food logging, calorie tracking, progress charts, and more!
            </div>
            
            <div class="mt-4">
                <button class="btn btn-success btn-lg me-2" disabled>
                    <i class="fas fa-plus-circle me-2"></i>Log Food
                </button>
                <button class="btn btn-outline-success btn-lg" onclick="window.location.href='onboarding.html'">
                    <i class="fas fa-user-edit me-2"></i>Edit Profile
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Check if user has completed onboarding
        async function checkAccess() {
            try {
                const response = await fetch('http://localhost:8000/api/profile/status');
                const data = await response.json();
                
                if (!data.complete) {
                    // Not completed, redirect to onboarding
                    alert('Please complete onboarding first');
                    window.location.href = 'onboarding.html';
                }
            } catch (error) {
                console.error('Error checking access:', error);
            }
        }
        
        function logout() {
            // Clear any stored tokens (if implemented)
            localStorage.clear();
            sessionStorage.clear();
            
            // Redirect to login
            window.location.href = 'index.html';
        }
        
        // Check access on load
        checkAccess();
    </script>
</body>
</html>
