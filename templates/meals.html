<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meals</title>
</head>
<body>
    <h1>Your Meals</h1>
    <ul>
        {% for meal in meals %}
        <li>
            {{ meal.weight_val }} gm of {{ meal.meal_name }} - {{ meal.kcal_val }} kcal
            <a href="/meal/edit/{{ meal.id }}">Edit</a>
            <a href="/meal/delete/{{ meal.id }}">Delete</a>
        </li>
        {% endfor %}
    </ul>
    <a href="/meal/add_meal">Add a New Meal</a>
</body>
</html>
