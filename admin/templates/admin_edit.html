<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="/static/admin_styles.css">
</head>
<body>
    <div class="sidebar">
        <h2>NutriTracker Admin</h2>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/logout">Logout</a>
    </div>

    <div class="main-content">
        <div class="dashboard-container">
            <h1>Edit User: {{ user.full_name or user.email }}</h1>

            <form action="/admin/edit/{{ user.user_id }}" method="post">
                <div class="form-group" style="text-align: left; max-width: 500px; margin: 20px auto;">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user.full_name or '' }}" required style="width: 100%;">
                </div>
                <div class="form-group" style="text-align: left; max-width: 500px; margin: 20px auto;">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required style="width: 100%;">
                </div>
                <div class="form-group" style="text-align: left; max-width: 500px; margin: 20px auto;">
                    <label for="is_active">Active?</label>
                    <input type="checkbox" id="is_active" name="is_active" {% if user.is_active %}checked{% endif %}>
                </div>
                <button type="submit" style="width: 100%; max-width: 500px; margin: 20px auto; display: block;">Save Changes</button>
            </form>
        </div>
    </div>
</body>
</html>
